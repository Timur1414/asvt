name: Build and Push Images

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image metadata
        id: vars
        run: |
          echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build & Push API Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile_api
          push: true
          tags: |
            timur1414/asvt-api:latest
            timur1414/asvt-api:${{ github.sha }}
            timur1414/asvt-api:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & Push Security Checker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deployment/docker/Dockerfile_security_checker
          push: true
          tags: |
            timur1414/asvt-security-checker:latest
            timur1414/asvt-security-checker:${{ github.sha }}
            timur1414/asvt-security-checker:${{ steps.vars.outputs.sha_short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
