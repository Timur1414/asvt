services:
  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile_api
    container_name: api
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - asvt-network

  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: mediamtx
    restart: unless-stopped
    ports:
      - "8554:8554" # RTSP
    expose:
      - "1935" # RTMP
      - "8888" # HLS
      - "8889" # WebRTC
    # volumes:
    #   - ./mediamtx.yml:/mediamtx.yml

networks:
  asvt-network:
    name: asvt-network
    driver: bridge
