services:
  postgres:
    image: postgres:17
    container_name: postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} -p 5432" ]
      interval: 5s
      timeout: 5s
      retries: 5
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-logs:/var/log/postgresql
    networks:
      - asvt-network

  redis:
    image: redis:8.8.3-alpine3.23
    container_name: redis
    healthcheck:
      test: [ "CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - asvt-network

  api:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile_api
    container_name: api
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    expose:
      - "8080"
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
    healthcheck:
      test: [ "CMD-SHELL", "curl -fsS http://127.0.0.1:8080/healthz" ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - asvt-network

  security_checker:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile_security_checker
    container_name: security_checker
    restart: always
    read_only: true
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./log:/app/log
    env_file:
      - .env
    depends_on:
      - redis
      - postgres
    networks:
      - asvt-network

